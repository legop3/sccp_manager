; Managed by SCCP Manager. Included from extensions_custom.conf.
; These contexts are private helpers: do NOT include them in from-internal.
; AMI Originate supplies the voicemail Caller ID to PreDialGoSub while the
; outbound SCCP channel exists but BEFORE it displays the incoming call.
[sccp-manager-voicemail-predial]
exten => s,1,Set(CHANNEL(CallingParty)="${ARG1}" <${ARG2}>)
 same => n,Return()

; The playback application executes on the original SCCP channel after
; auto-answer. No Local channel, media proxy, artificial delay or AGI.
[sccp-manager-voicemail-play]
exten => s,1,VoiceMailPlayMsg(${SCCP_VM_MAILBOX}@default,${SCCP_VM_ID})
 same => n,Hangup()

; Normal user-originated access to the Asterisk/FreePBX voicemail menus.
; Unlike FreePBX's *97 feature code, this route does NOT require the
; outgoing SCCP Caller ID to identify the user's mailbox; the phone's
; authenticated visual voicemail endpoint supplies the default line in
; the Dial URI: Dial:*9900<mailbox>.
; Keep the usual voicemail PIN check: no 's' skip-password option.
; This is deliberately a phone-originated call, never AMI Originate, and it
; leaves the Messages XML app using Init:Messages before/while dialing.
[from-internal-custom]
exten => _*9900.,1,NoOp(SCCP Manager: traditional voicemail menu)
 same => n,Set(SCCP_VM_TARGET=${EXTEN:5})
 same => n,GotoIf($["${FILTER(0-9,${SCCP_VM_TARGET})}" != "${SCCP_VM_TARGET}"]?invalid)
 same => n,Answer()
 same => n,VoiceMailMain(${SCCP_VM_TARGET}@default)
 same => n,Hangup()
 same => n(invalid),Hangup()
