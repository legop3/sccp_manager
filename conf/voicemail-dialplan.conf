; Managed by SCCP Manager. Included from extensions_custom.conf.
; These contexts are private helpers: do NOT include them in from-internal.
; AMI Originate supplies the voicemail Caller ID to PreDialGoSub while the
; outbound SCCP channel exists but BEFORE it displays the incoming call.
[sccp-manager-voicemail-predial]
exten => s,1,Set(CHANNEL(CallingParty)="${ARG1}" <${ARG2}>)
 same => n,Return()

; The playback application executes on the original SCCP channel after
; auto-answer. No Local channel, media proxy, artificial delay or AGI.
[sccp-manager-voicemail-play]
exten => s,1,VoiceMailPlayMsg(${SCCP_VM_MAILBOX}@default,${SCCP_VM_ID})
 same => n,Hangup()
