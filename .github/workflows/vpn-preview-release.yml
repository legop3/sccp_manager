name: SCCP Manager VPN preview package

on:
  push:
    branches:
      - feature/vpn-provisioning

permissions:
  contents: write

# Only the newest commit may replace the preview asset. Older builds of the
# same tag must not race and overwrite it with an outdated tarball.
concurrency:
  group: sccp-phone-content-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, dom, simplexml, gd
      - name: Verify included module, PHP, and integration tests
        run: |
          php -l install.php
          php -l Sccp_manager.class.php
          php -l sccpManClasses/vpnprovisioning.class.php
          php -l sccpManClasses/vpnfirewall.class.php
          php -l sccpManClasses/xmlinterface.class.php
          php -l sccpManClasses/aminterface.class.php
          php -l page.sccp_vpn.php
          php -r 'simplexml_load_file("module.xml") ?: exit(1);'
          python3 -m py_compile scripts/sccp-manager-vpn-helper scripts/sccp-manager-ocserv-setup
          bash -n scripts/install-vpn-helper.sh
          bash -n scripts/ensure-cisco-ocserv.sh
          python3 -m py_compile scripts/sccp-manager-vpn-helper
          php -l sccpManClasses/phonecontent.class.php
          php -l sccpManClasses/phonemenus.class.php
          php -l sccpManClasses/phonevoicemail.class.php
          php -l page.sccp_content.php
          php -l views/content.contacts.php
          php -l views/content.menus.php
          php -l views/content.wallpapers.php
          php -l views/content.ringtones.php
          php tests/phone-content.php
          php tests/phone-content-7945.php
          php tests/phone-menus.php
          php tests/phone-voicemail.php
          php -l views/content.status.php
          php tests/vpn-provisioning.php
          php tests/vpn-firewall.php
          php tests/vpn-ui.php
          python3 tests/test_vpn_accounts.py
          sudo apt-get update -qq
          sudo apt-get install -y ocserv
          python3 tests/test_ocserv_setup.py
          php tests/regression-sccp.php
          git clone --depth 1 https://github.com/usecallmanagernz/certutils.git /tmp/certutils-test
          python3 -m venv /tmp/vpn-checks
          /tmp/vpn-checks/bin/pip install cryptography
          /tmp/vpn-checks/bin/python tests/test_vpn_helper.py /tmp/certutils-test
      - name: Build Cisco-capable ocserv automatically on Debian 12
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:12 bash -ec '
            # Simulate Bookworm with no source build pre-installed.
            apt-get update -qq
            apt-get install -y --no-install-recommends ocserv
            /usr/sbin/ocserv --version 2>&1 | grep -q 1.1.6
            bash /src/scripts/ensure-cisco-ocserv.sh > /tmp/ocserv-path
            test "$(cat /tmp/ocserv-path)" = "/usr/local/sbin/ocserv"
            /usr/local/sbin/ocserv --version 2>&1 | grep -q 1.3.0
            bash /src/scripts/ensure-cisco-ocserv.sh > /tmp/ocserv-again
            cmp /tmp/ocserv-path /tmp/ocserv-again
          '
      - name: Start managed ocserv from a clean install (integration smoke test)
        run: |
          id asterisk || sudo useradd --system --no-create-home asterisk
          sudo mkdir -p /tftpboot
          sudo bash scripts/install-vpn-helper.sh
          sudo -u asterisk sudo -n /usr/local/libexec/sccp-manager-vpn-helper status
          printf '%s' '{"gateway":"https://vpn.example.test:4443/svc","pbx_ip":"192.168.0.25","vpn_subnet":"10.254.77.0/24","udp_port":443,"max_same_clients":0}' |
            sudo /usr/local/libexec/sccp-manager-vpn-helper configure
          sudo systemctl is-active --quiet sccp-ocserv.service
          curl -ksS -D /tmp/sccp-vpn-http-response -o /dev/null \
            -A 'Cisco SVC IPPhone Client v1.0' https://127.0.0.1:4443/svc
          grep -Eq '^HTTP/1\.[01] 200' /tmp/sccp-vpn-http-response
          grep -qi 'Set-Cookie: webvpnlogin=1' /tmp/sccp-vpn-http-response
          printf '%s\n' 'test-ci-password-only' |
            sudo /usr/local/libexec/sccp-manager-vpn-helper set-account testphone
          sudo grep -q '^testphone::\$6\$' /etc/ocserv/ocpasswd
          python3 -c 'import socket; s=socket.create_connection(("127.0.0.1",4443),5); s.close()'
          sudo -u asterisk sudo -n /usr/local/libexec/sccp-manager-vpn-helper hash
          sudo systemctl stop sccp-ocserv.service
      - name: Make FreePBX module tarball
        run: |
          mkdir -p "$RUNNER_TEMP/vpn-package/sccp_manager"
          rsync -a --exclude=.git --exclude=.github --exclude=tests \
            ./ "$RUNNER_TEMP/vpn-package/sccp_manager/"
          tar -C "$RUNNER_TEMP/vpn-package" -czf sccp_manager.tar.gz sccp_manager
          tar -tzf sccp_manager.tar.gz | grep -q sccp_manager/module.xml
          tar -tzf sccp_manager.tar.gz | grep -q sccp_manager/conf/voicemail-dialplan.conf
          tar -tzf sccp_manager.tar.gz | grep -q sccp_manager/sccpManClasses/phonecontent.class.php
          tar -tzf sccp_manager.tar.gz | grep -q sccp_manager/vendor/certutils/sgnfile
          tar -tzf sccp_manager.tar.gz | grep -q sccp_manager/scripts/sccp-manager-vpn-helper
          tar -tzf sccp_manager.tar.gz | grep -q sccp_manager/scripts/sccp-manager-ocserv-setup
          tar -xOzf sccp_manager.tar.gz sccp_manager/sccpManClasses/aminterface.class.php | grep -q 'parseRealTimeStatusOutput'
          if tar -xOzf sccp_manager.tar.gz sccp_manager/sccpManClasses/aminterface.class.php | grep -q '\$this_realm'; then
            echo 'Stale aminterface RealTime parser found in package' >&2
            exit 1
          fi
          tar -xOzf sccp_manager.tar.gz sccp_manager/sccpManTraits/helperFunctions.php | grep -q "externhost'"
      - uses: actions/upload-artifact@v4
        with:
          name: sccp-manager-vpn-tarball
          path: sccp_manager.tar.gz
      - name: Publish fork-only preview asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view vpn-preview-17.1.34 >/dev/null 2>&1; then
            gh release create vpn-preview-17.1.34 \
              --target "$GITHUB_SHA" --title "SCCP Manager 17.1.34 VPN + Phone Content preview" \
              --notes "Development build from feature/vpn-provisioning. Not upstream. Test on a backed-up FreePBX installation." \
              --prerelease --latest=false sccp_manager.tar.gz
          else
            gh release upload vpn-preview-17.1.34 sccp_manager.tar.gz --clobber
          fi
