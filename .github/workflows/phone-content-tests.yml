name: Phone Content PHP tests

on:
  push:
    branches:
      - feature/vpn-provisioning
  pull_request:

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP XML support
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-xml php-gd
      - name: Syntax checks
        run: |
          find sccpManClasses sccpManTraits views tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l Sccp_manager.class.php
          php -l scripts/sccp-manager-vm-playback.agi
          php -l page.sccp_content.php
      - name: Phone Content regressions
        run: |
          php tests/phone-content.php
          php tests/phone-content-7945.php
          php tests/phone-menus.php
          php tests/phone-voicemail.php
