name: PHP notification lint
on:
  push:
    branches:
      - stable
  pull_request:
    paths:
      - 'sccpManClasses/**'
      - 'views/content.notifications.php'
      - 'scripts/notifications.php'
      - 'install.php'
      - 'Sccp_manager.class.php'
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint modified PHP
        run: |
          php -l Sccp_manager.class.php
          php -l sccpManClasses/phoneNotifications.class.php
          php -l sccpManClasses/notificationConfig.class.php
          php -l sccpManClasses/notificationDelivery.class.php
          php -l sccpManClasses/notificationSources.class.php
          php -l sccpManClasses/notificationWorker.class.php
          php -l sccpManClasses/phonecontent.class.php
          php -l views/content.notifications.php
          php -l scripts/notifications.php
          php -l install.php
          php -l tests/missed-call-classifier.php
      - name: Check missed call classification
        run: php tests/missed-call-classifier.php
