name: VPN provisioning checks

on:
  push:
    branches:
      - feature/vpn-provisioning
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, dom, simplexml
      - name: PHP syntax
        run: |
          php -l sccpManClasses/vpnprovisioning.class.php
          php -l sccpManClasses/vpnfirewall.class.php
          php -l sccpManClasses/xmlinterface.class.php
          php -l sccpManClasses/aminterface.class.php
          php -l Sccp_manager.class.php
          php -l sccpManTraits/bmoFunctions.php
          php -l page.sccp_vpn.php
          php -l install.php
          php -r 'simplexml_load_file("module.xml") ?: exit(1);'
      - name: Validate helper and installer syntax
        run: |
          python3 -m py_compile scripts/sccp-manager-vpn-helper scripts/sccp-manager-ocserv-setup
          bash -n scripts/install-vpn-helper.sh
          python3 -m py_compile scripts/sccp-manager-vpn-helper
      - name: First-run ocserv configuration test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ocserv
          python3 tests/test_ocserv_setup.py
      - name: VPN provisioning tests
        run: |
          php tests/vpn-provisioning.php
          php tests/vpn-firewall.php
          php tests/vpn-ui.php
          python3 tests/test_vpn_accounts.py
          php tests/regression-sccp.php
      - name: Real certutils integration test
        run: |
          git clone --depth 1 https://github.com/usecallmanagernz/certutils.git /tmp/sccp-test-certutils
          python3 -m venv /tmp/sccp-vpn-venv
          /tmp/sccp-vpn-venv/bin/pip install cryptography
          PATH=/tmp/sccp-vpn-venv/bin:$PATH /tmp/sccp-vpn-venv/bin/python tests/test_vpn_helper.py /tmp/sccp-test-certutils
